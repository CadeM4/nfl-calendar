name: Refresh and publish NFL calendar

on:
  schedule:
    - cron: '23 2,8,14,20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'public/**', 'README.md', 'SCHEMA.md']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nfl-calendar-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -e .
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Fetch official schedule and validate complete output
        run: python -m nfl_calendar
      - name: Persist last known good data and event revisions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data public
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified NFL schedule and calendar feeds'
            git push
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          retention-days: 1
      - name: Deploy complete verified bundle
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Explain failed refresh
        if: failure()
        run: echo 'Refresh or deployment failed. The previously deployed Pages feed remains online. Inspect the failed step; do not upload partial output.' >> "$GITHUB_STEP_SUMMARY"
